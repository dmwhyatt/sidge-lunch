[project]
name = "sidge-lunch-scraper"
version = "0.1.0"
description = "Scrapes college menus near the Sidgwick Site into a common JSON format."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools]
packages = ["sidge_lunch", "sidge_lunch.adapters"]

[tool.pytest.ini_options]
testpaths = ["tests"]

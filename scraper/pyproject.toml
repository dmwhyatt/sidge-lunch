[project]
name = "sidge-lunch-scraper"
version = "0.1.0"
description = "Scrapes college menus near the Sidgwick Site into a common JSON format."
requires-python = ">=3.11"
dependencies = [
    "requests>=2.31",
    "beautifulsoup4>=4.12",
    "lxml>=5.0",
    "pdfplumber>=0.11",
]

[project.optional-dependencies]
dev = ["pytest>=8"]
render = ["playwright>=1.45"]  # only for vendors drawn by JavaScript (scrape-rendered.yml)

[tool.setuptools]
packages = ["sidge_lunch", "sidge_lunch.adapters"]

[tool.setuptools.package-data]
sidge_lunch = ["college_access.json"]

[tool.pytest.ini_options]
testpaths = ["tests"]

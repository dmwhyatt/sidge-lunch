name: Wolfson probe (temporary)

# One-off: can the scraper, running on GitHub's servers, read Wolfson's cafeteria
# menus as an ordinary identified client? Two plain requests, no retries, nothing
# that gets round a bot check. Delete after reading the result.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/wolfson-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./scraper
      - name: Fetch robots.txt and the cafeteria menus once
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from sidge_lunch.fetch import USER_AGENT, _check_for_bot_check, BotCheck
          H = {"User-Agent": USER_AGENT}
          for url in ["https://www.wolfson.cam.ac.uk/robots.txt",
                      "https://www.wolfson.cam.ac.uk/food/cafeteria-menus"]:
              r = requests.get(url, headers=H, timeout=30, allow_redirects=False)
              print(f"== {url}\n   status {r.status_code}, {len(r.content)} bytes, location {r.headers.get('location')}")
              try:
                  _check_for_bot_check(url, r.content)
              except BotCheck as e:
                  print("   BOT CHECK:", e); continue
              if url.endswith("robots.txt"):
                  print(r.text[:1000]); continue
              s = BeautifulSoup(r.text, "lxml")
              for t in s(["script", "style", "noscript", "svg", "header", "footer", "nav"]): t.decompose()
              main = s.find("main") or s.body
              print(re.sub(r"\n\s*\n+", "\n", main.get_text("\n"))[:5000])
              print("----- links -----")
              print(sorted({a["href"] for a in main.find_all("a", href=True) if re.search(r"menu|pdf|week|\.doc", a["href"], re.I)})[:30])
              print("----- structure -----")
              print(re.sub(r"\n\s*\n+", "\n", main.prettify())[:8000])
          PY

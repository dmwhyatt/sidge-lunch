name: Queens' probe (temporary)

# One-off: can the scraper, running on GitHub's servers, read Queens' weekly menu
# as an ordinary identified client? Two plain requests, no retries, nothing that
# gets round a bot check. Delete after reading the result.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/queens-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./scraper
      - name: Fetch robots.txt and the weekly menu once
        run: |
          python - <<'PY'
          import re, requests
          from bs4 import BeautifulSoup
          from sidge_lunch.fetch import USER_AGENT
          H = {"User-Agent": USER_AGENT}
          for url in ["https://www.queens.cam.ac.uk/robots.txt",
                      "https://www.queens.cam.ac.uk/life-at-queens/catering/dining-hall/weekly-menu/"]:
              r = requests.get(url, headers=H, timeout=30, allow_redirects=False)
              blocked = "sgcaptcha" in r.text or r.status_code in (202, 403, 429)
              print(f"== {url}\n   status {r.status_code}, {len(r.text)} bytes, bot check: {blocked}")
              if blocked:
                  print("   " + r.text[:300].replace("\n", " "))
                  continue
              if url.endswith("robots.txt"):
                  print(r.text[:800]); continue
              s = BeautifulSoup(r.text, "lxml")
              for t in s(["script", "style", "noscript", "svg", "header", "footer", "nav"]): t.decompose()
              main = s.find("main") or s.body
              print(re.sub(r"\n\s*\n+", "\n", main.get_text("\n"))[:4000])
              print("----- structure -----")
              print(re.sub(r"\n\s*\n+", "\n", main.prettify())[:7000])
          PY

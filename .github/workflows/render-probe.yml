name: Render probe (temporary)

# One-off end-to-end check of the rendered scrape on this branch, without
# committing. Delete once the branch is merged.
on:
  push:
    branches: ["claude/**"]
    paths: [".github/workflows/render-probe.yml"]

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install './scraper[render]'
      - run: python -m playwright install --with-deps chromium
      - run: python -m sidge_lunch.run --data-dir data --rendered
      - name: Clare Hall result
        run: |
          python - <<'PY'
          import json
          v = json.load(open("data/menus.json"))["vendors"]["clare-hall"]
          print(v["status"], v["error"], [d["date"] for d in v["days"]])
          for d in v["days"][:1]:
              for m in d["meals"]:
                  print(m["name"], [(i["name"][:50], i["dietary"]) for i in m["items"]])
          PY

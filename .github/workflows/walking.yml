name: Walking times

# Recompute building → place walking routes (data/walking/<site>.json) when
# sites or places change, or on demand.
on:
  push:
    branches: [main]
    paths: ["data/sites.json", "data/vendors.json", "data/places.json"]
  workflow_dispatch:
  workflow_call:

permissions:
  contents: write

concurrency:
  group: data-commit
  cancel-in-progress: false

jobs:
  walking:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.ref }}
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install ./scraper
      - run: python -m sidge_lunch.walking --data-dir data
      - id: commit
        run: |
          git add -A data/walking
          if git diff --cached --quiet; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Update walking times"
          # Routing takes several minutes, and the menu scrape often pushes meanwhile.
          # This job only writes data/walking/, so rebasing onto that push can't conflict.
          for attempt in 1 2 3 4 5; do
            git push origin HEAD:${{ github.ref_name }} && break
            [ "$attempt" = 5 ] && exit 1
            sleep $((attempt * 5))
            git pull --rebase origin ${{ github.ref_name }}
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  deploy:
    needs: walking
    if: needs.walking.outputs.changed == 'true' && github.ref_name == 'main'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

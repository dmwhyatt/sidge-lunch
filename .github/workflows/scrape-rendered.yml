name: Scrape rendered menus

# Menus drawn by JavaScript (vendors marked "render" in vendors.json, e.g. Clare
# Hall's Sway) need a headless browser, which takes a minute to set up, so they
# run a few times a day rather than with every menu scrape. Off-peak minutes:
# GitHub delays or drops many scheduled runs at the top of the hour.
on:
  schedule:
    - cron: "43 5,8,10 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-scrape places that already have today's menu"
        type: boolean
        default: false

permissions:
  contents: write

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml
      - run: pip install './scraper[render]'
      - run: python -m playwright install --with-deps chromium
      - id: commit
        name: Scrape and commit
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # The menu scrape may push menus.json meanwhile: start again from the latest commit and retry.
          for attempt in 1 2 3; do
            git fetch origin ${{ github.ref_name }}
            git reset --hard origin/${{ github.ref_name }}
            python -m sidge_lunch.run --data-dir data --rendered ${{ inputs.force && '--force' || '' }}
            if git diff --quiet -- data/menus.json; then
              echo "changed=false" >> "$GITHUB_OUTPUT"
              exit 0
            fi
            git add data/menus.json
            git commit -m "Update rendered menus"
            if git push origin HEAD:${{ github.ref_name }}; then
              echo "changed=true" >> "$GITHUB_OUTPUT"
              exit 0
            fi
          done
          exit 1

  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write

name: Scrape menus

on:
  schedule:
    # UTC. GitHub runs scheduled workflows on a best-effort basis and delays or drops
    # many that fall on the hour or half hour, so these use off-peak minutes.
    # Every 30 min through the morning (05:07–12:37 UTC, i.e. 06:07–13:37 in BST),
    # then every 3 h for menus posted in the afternoon or the night before.
    - cron: "7,37 5-12 * * *"
    - cron: "17 14-23/3 * * *"
  workflow_dispatch:
    inputs:
      force:
        description: "Re-scrape places that already have today's menu"
        type: boolean
        default: false

permissions:
  contents: write

# No concurrency group: with one, GitHub keeps only the newest waiting run and cancels
# the rest, and other data workflows could hold scrapes up. Pushes retry instead.

jobs:
  scrape:
    runs-on: ubuntu-latest
    outputs:
      changed: ${{ steps.commit.outputs.changed }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: scraper/pyproject.toml
      - run: pip install ./scraper
      - run: python -m sidge_lunch.run --data-dir data ${{ inputs.force && '--force' || '' }}
      - id: commit
        name: Commit if menus changed
        run: |
          if git diff --quiet -- data/menus.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add data/menus.json
          git commit -m "Update menus"
          # Another workflow may have pushed meanwhile; menus.json is only written here.
          for attempt in 1 2 3; do
            git push origin HEAD:${{ github.ref_name }} && break
            git pull --rebase origin ${{ github.ref_name }}
          done
          echo "changed=true" >> "$GITHUB_OUTPUT"

  # Pushes made with GITHUB_TOKEN don't trigger other workflows, so deploy from here.
  deploy:
    needs: scrape
    if: needs.scrape.outputs.changed == 'true'
    uses: ./.github/workflows/deploy.yml
    permissions:
      contents: read
      pages: write
      id-token: write
